<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Todo App</h1>

    <div class="add-row">
      <input id="todoInput" type="text" placeholder="What needs to be done?">
      <button id="addBtn">Add</button>
    </div>

    <div class="toolbar">
      <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
      <div class="filters">
        <button class="filter selected" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
      <span id="count">0 items left</span>
      <div>
        <button id="clearCompleted">Clear completed</button>
        <button id="clearAll">Clear all</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
